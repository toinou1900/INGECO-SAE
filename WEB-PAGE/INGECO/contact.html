<!DOCTYPE html>
<html lang="fr">
    <head>  
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>INGECO | Contact</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com"> 
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
        
        <link rel="icon" type="image/png" href="img/favicon.png">
    </head>
    <body>

        <!-- ========== HEADER ========== -->

        <header>

            <div class="conteneur row">

                <!-- Logo -->
                <a href="index.html">
                    <img src="./assets/logo/Logo_Ingeco_Territoires_multicolore.png"
                        alt="Logo INGECO TERRITOIRES" id="image-accueil">
                </a>

                <!-- Navigation principale -->
                <nav class="navigation-principale">
                    <ul>
                        <li><a href="index.html">Accueil</a></li>
                        <li><a href="presentation.html">Présentation</a></li>
                        <li><a href="action.html">Actions</a></li>
                        <li><a href="contact.html">Contact</a></li>
                        <li><a href="offres.html" aria-current="page">Offres</a></li>
                        <li class="formation"><a href="formation.html">Formations</a></li>
                    </ul>
                </nav>

            </div>

        </header>


        <!-- ========== CONTENU PRINCIPAL ========== -->

        <main class="conteneur">

                 <!-- Bannière du haut -->

            <section class="bandeau-main">

                <img src="./assets/img/Collaboration joyeuse au bureau.png"
                    alt="" class="image-accueil">

                <div class="background-bandeau"></div>
                <div class="background-titre1"></div>

                <div class="bandeau-titre-contact">

                <h1>Nous contacter</h1>
                <h2> Une question , un projet ou un besoin d'accompagnement ? </h2>

                </div>

            </section>

            <!-- Colonne de gauche : Coordonnées -->

            <section class="contact-info"></section>

                <div class="contact-adresse">

                    <h2>Adresse</h2>
                    <p>a definir</p>
                    <img src="./assets/icones/pin-svgrepo-com.svg"> 
                </div>

                <div class="contact-telephone">
                    <h2>Téléphone</h2>
                    <p>a definir</p>
                    <img src="./assets/icones/phone-svgrepo-com.svg"> 
                </div>

                <div class="contact-email">
                    <h2>Email</h2>
                    <p>contact@ingeco-territoires.fr</p>
                    <img src="./assets/icones/mail-alt-svgrepo-com.svg">        
                </div>
                
                </section>

            <aside>

                <!-- Colonne de droite : Formulaire -->
                 
            <section class="contact-formulaire"></section>

                <label for="Nom">Nom </label>
       				 <input type="text" id="Nom" name="Nom">

                <label for="Prénom">Prénom </label>
                    <input type="text" id="Prénom" name="Prénom">

                <label for="Email">Email </label>
                    <input type="email" id="Email" name="Email">

                <label for="Téléphone">Téléphone</label>
                    <input type="tel" id="Téléphone" name="Téléphone">

                <label for="Message">Message </label>
                    <textarea id="Message" name="Message"></textarea>

                <button type="submit">Envoyer le message</button>

            </section>
            </aside>

        </main>


        <!-- ========== FOOTER ========== -->

        <footer>

            <div class="conteneur">

                <a href="index.html">
                    <img src="./assets/logo/Logo_blanc_Ingeco_Territoires.png"
                        alt="Logo INGECO TERRITOIRES">
                </a>

                <!-- Lien à ajouter lorsque la page sera définie -->
                <p>Conditions et assistance</p>

                <!-- Réseaux sociaux : liens à définir avec la cliente -->
                <div class="reseaux-sociaux">


                    <ul>
                        <li>
                            <a href="#">
                                <img src="./assets/icones/instagram-svgrepo-com.svg" alt="logo instagram">
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <img src="./assets/icones/facebook-svgrepo-com.svg"
                                alt="logo facebook">

                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <img src="./assets/icones/linkedin-svgrepo-com.svg"
                                alt="logo linkedin">

                            </a>
                        </li>
                    </ul>

                    
                </div>

            </div>

        </footer>

    </body>
    <script src="js/script.js"></script>
</html>
